name: Autotests

on: #когда запускаться
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest #на какой операционной системе запускать мой workflow

    steps: #пошаговая инструкци, порядок важен
      - name: Checkout code
        uses: actions/checkout@v4 #скачивание репозитория на временную виртуальную машину

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' #этот шаг “ставит” Python на виртуальную машину, чтобы pytest и остальные библиотеки могли работать

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip 
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest
